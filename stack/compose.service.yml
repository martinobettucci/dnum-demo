# Surcouche de la pile service (projet dnum-service, SPEC-004.7, ADR-004, ADR-008), ajoutée par ./dev.
# Elle ne fait que : restart unless-stopped sur app, et image devenv/app:service.
# Elle ne redéfinit PAS ports : la publication ${APP_LAN_IP}:${APP_PORT}:80 est héritée de compose.yml
# (les listes ports sont fusionnées par compose : une redéfinition créerait une seconde publication, ADR-007 §2).
services:
  app:
    image: devenv/app:service
    restart: unless-stopped
