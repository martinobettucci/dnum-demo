# Passerelle unique (ADR-001, ADR-002, ADR-006 §1, ADR-007). SPEC-001.6 à 001.9, SPEC-001.14.
# - /auth/v1/* -> auth:9999/* et /rest/v1/* -> rest:3000/* (préfixe retiré, en-têtes transmis) ;
# - /auth/v1/admin/* refusé (403), API d'administration GoTrue jamais relayée ;
# - aucune limitation de débit (ni limit_req, ni limit_conn) sur /auth/v1/ ni /rest/v1/ ;
# - CSP unique sur toutes les réponses (default-src 'self', connect-src 'self').
# Résolution DNS interne à l'exécution : la passerelle démarre même si auth ou rest ne répondent pas encore.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # API d'administration GoTrue : refus. Les variantes de chemin sont normalisées par nginx avant
    # l'évaluation (//, /./, ../, %61dmin, %2F) ; cette expression régulière doit donc précéder /auth/v1/.
    location ~ ^/auth/v1/admin(/|$) {
        return 403;
    }

    location /auth/v1/ {
        set $auth_amont auth:9999;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://$auth_amont;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rest/v1/ {
        set $rest_amont rest:3000;
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass http://$rest_amont;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /vendor/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
